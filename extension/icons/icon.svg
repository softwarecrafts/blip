<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Instrument-dark rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0c1c1a"/>
  <!-- Radar range rings -->
  <g fill="none" stroke="#2fd6a6" stroke-width="3">
    <circle cx="64" cy="64" r="40" opacity="0.30"/>
    <circle cx="64" cy="64" r="26" opacity="0.45"/>
    <circle cx="64" cy="64" r="12" opacity="0.6"/>
  </g>
  <!-- Crosshair -->
  <g stroke="#2fd6a6" stroke-width="2" opacity="0.22">
    <line x1="64" y1="20" x2="64" y2="108"/>
    <line x1="20" y1="64" x2="108" y2="64"/>
  </g>
  <!-- Sweep wedge -->
  <path d="M64 64 L64 24 A40 40 0 0 1 99 50 Z" fill="#2fd6a6" opacity="0.18"/>
  <!-- The contact: off-axis red blip with glow -->
  <circle cx="88" cy="44" r="16" fill="#ff5a4d" opacity="0.25"/>
  <circle cx="88" cy="44" r="8" fill="#ff5a4d"/>
</svg>
