<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 12px 14px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0; }
      #count { opacity: 0.6; font-variant-numeric: tabular-nums; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { margin: 0 0 2px; }
      a.chat {
        display: block;
        padding: 7px 8px;
        border-radius: 6px;
        text-decoration: none;
        color: inherit;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      a.chat:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
      .empty { opacity: 0.6; padding: 8px 0; }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent);
      }
      button, a.link {
        font: inherit;
        background: none;
        border: none;
        color: inherit;
        opacity: 0.7;
        cursor: pointer;
        padding: 0;
        text-decoration: none;
      }
      button:hover, a.link:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <h1>Waiting on you</h1>
      <span id="count"></span>
    </header>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden>Nothing waiting. 🎉</div>
    <footer>
      <button id="refresh">↻ Refresh</button>
      <a class="link" id="options" href="#">Settings</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
